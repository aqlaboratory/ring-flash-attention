[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-flash-attn"
version = "0.1.8"
authors = [
  { name="zhuzilin", email="zhuzilinallen@gmail.com" },
]
description = "Ring attention implementation with flash attention."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Selection stays a runtime decision via RING_FLASH_ATTN_BACKEND; this extra only
# documents the package that provides the `flash_attn.cute` backend. flash-attn-4 is
# not on PyPI as of this writing -- install it from a flash-attention checkout with
# `pip install -e <checkout>/flash_attn/cute`.
fa4 = ["flash-attn-4"]

[project.urls]
Homepage = "https://github.com/zhuzilin/ring-flash-attention"
Issues = "https://github.com/zhuzilin/ring-flash-attention/issues"
