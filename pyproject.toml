[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-flash-attn"
version = "0.1.8"
authors = [
  { name="zhuzilin", email="zhuzilinallen@gmail.com" },
]
description = "Ring attention implementation with flash attention."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Selection stays a runtime decision via RING_FLASH_ATTN_BACKEND; these extras only
# document which distribution provides each backend. Neither is on PyPI as of this
# writing -- both are built from a flash-attention checkout:
#   fa3: `pip install -e <checkout>/hopper`            (needs CUDA_HOME; sm90a by default)
#   fa4: `pip install -e <checkout>/flash_attn/cute`
fa3 = ["flash-attn-3"]
fa4 = ["flash-attn-4"]

[project.urls]
Homepage = "https://github.com/zhuzilin/ring-flash-attention"
Issues = "https://github.com/zhuzilin/ring-flash-attention/issues"
